# Visits the live site every 10 minutes so Render's free plan does not put it to sleep.
name: Keep the site awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 https://misbar-vq28.onrender.com/api/login > /dev/null || true

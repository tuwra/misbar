/* Layout: an observatory. Deep night-blue ground, sodium-lamp amber for action, cyan for measured data.

  --bg: #090E1A; --bg-2: #0D1424; --surface: #111A2C; --surface-2: #17223A; --line: #24314C; --line-2: #31405F;
  --fg: #E8EDF7; --fg-2: #C3CCDD; --mute: #8B97B0;
  --accent: #F2B544; --accent-ink: #1A1205; --signal: #5CC8FF; --violet: #A78BFA; --ok: #4ADE9A; --bad: #FF6B6B; --warn: #F5A524;

  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -24px rgba(0,0,0,.7);

  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --r-lg: 22px; --ease: cubic-bezier(.2,.7,.2,1);
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 72px;
}

  --bg: #F3F5F9; --bg-2: #EBEFF6; --surface: #FFFFFF; --surface-2: #EEF2F8; --line: #D8DFEB; --line-2: #C3CDDE;
  --fg: #0D1526; --fg-2: #2E3A52; --mute: #5A6680;

} }

  --glow: rgba(178, 110, 18, .22); --sig-soft: rgba(11, 127, 191, .09); --acc-soft: rgba(178, 110, 18, .09); --ok-soft: rgba(21, 128, 61, .09); --bad-soft: rgba(209, 44, 44, .08); --warn-soft: rgba(180, 83, 9, .09);

}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.backdrop { position: fixed; inset: 0; pointer-events: none; z-index: -1; background: radial-gradient(1100px 520px at 85% -10%, var(--sig-soft), transparent 60%), radial-gradient(900px 500px at 0% 110%, var(--acc-soft), transparent 60%), var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); font-weight: 600; }

h3 { font-size: 1.1rem; font-weight: 600; }
h4 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--signal); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hidden { display: none !important; }
.ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
[dir="rtl"] .ic.flipx, [dir="rtl"] .choice-go .ic, [dir="rtl"] .btn .ic[data-dir], [dir="rtl"] .back .ic { transform: scaleX(-1); }
.fine { font-size: .82rem; color: var(--mute); line-height: 1.55; }
.lead-sm { color: var(--fg-2); max-width: 68ch; }
.eyebrow { font: 600 .74rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.row { display: flex; align-items: center; } .gap { gap: var(--s-3); } .wrap { flex-wrap: wrap; } .center { justify-content: center; }
.bad { color: var(--bad); } .ok { color: var(--ok); }
.warn-text { color: var(--warn); font-size: .88rem; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: var(--s-4); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); font: 700 1.22rem/1 var(--f-display); }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 4px; margin-inline-start: var(--s-4); }
.nav a { color: var(--fg-2); padding: 7px 12px; border-radius: 10px; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a.on { color: var(--fg); background: var(--surface-2); }
.top-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--mute); padding: 5px 10px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; cursor: help; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.pill.ok::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.pill.warn::before { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; color: var(--fg-2); font-size: .85rem; }
.tbtn:hover { border-color: var(--line-2); color: var(--fg); }
@media (max-width: 860px) { .pill span { display: none; } .pill { padding: 6px; } .nav { margin-inline-start: 0; } #theme-label { display: none; } }
@media (max-width: 520px) { .brand span { display: none; } .nav a { padding: 6px 8px; font-size: .9rem; } .top-in { gap: 8px; } .top-tools { gap: 4px; } .tbtn { padding: 6px 8px; font-size: .8rem; } #who span { display: none; } }
@media (max-width: 420px) { #status-store, #status-ai { display: none; } .nav { margin-inline-start: 0; } }

/* ---------- view frame ---------- */
.view { max-width: 1320px; margin: 0 auto; padding-block: var(--s-6) var(--s-8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; animation: rise .45s var(--ease); }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-5); }
.page-head h1 { margin-block: 6px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-4); }
.link { background: none; border: 0; padding: 0; color: var(--signal); cursor: pointer; font-weight: 500; text-align: start; }
.link:hover { text-decoration: underline; }
.back { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }

/* ---------- buttons and controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; transition: transform .15s var(--ease), box-shadow .2s, background .2s; text-decoration: none; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -12px var(--glow); }
.btn:active { transform: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); box-shadow: none; }
.btn.sm { padding: 6px 12px; font-size: .86rem; border-radius: 10px; }
.btn.big { white-space: normal; text-align: center; padding: 14px 22px; font-size: 1.02rem; width: 100%; border-radius: 14px; }
.btn.glow { box-shadow: 0 0 0 1px var(--glow), 0 14px 34px -14px var(--glow); }
.btn.danger, .btn.bad { background: var(--bad); color: #fff; }
.btn.okb { background: var(--ok); color: #04130b; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); cursor: pointer; }
.icon-btn:hover:not(:disabled) { border-color: var(--line-2); color: var(--fg); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: .88rem; cursor: pointer; transition: border-color .15s, background .15s; }
button.chip:hover { border-color: var(--signal); color: var(--fg); }
.chip.on { background: var(--sig-soft); border-color: var(--signal); color: var(--fg); }
.chip.ok { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: var(--ok-soft); color: var(--fg); cursor: default; }
.chip.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: var(--bad-soft); color: var(--fg); cursor: default; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer; color: var(--mute); font-size: .88rem; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.ctl { display: grid; gap: 6px; font-size: .88rem; color: var(--fg-2); border: 0; padding: 0; margin: 0; min-width: 0; }
.ctl > span, .ctl > legend { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; padding: 0; }
.ctl output { font: 600 .85rem var(--f-mono); color: var(--signal); direction: ltr; }
.ctl.inline { display: inline-grid; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input:not([type]), select, textarea { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--fg); transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px var(--sig-soft); }
textarea { resize: vertical; line-height: 1.6; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 22px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; color: var(--fg-2); }
.check input { accent-color: var(--accent); width: 17px; height: 17px; }
.check.disabled { opacity: .45; }
.checks-row { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.shake { animation: shake .4s; border-color: var(--bad) !important; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5); display: grid; gap: var(--s-4); align-content: start; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); }
.notice > div { display: grid; gap: 8px; min-width: 0; justify-items: start; }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.notice.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-soft); flex-direction: column; }
.notice.ok { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-soft); }
.notice ul { margin: 0; padding-inline-start: 20px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 500 .72rem/1.3 var(--f-body); padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--mute); border: 1px solid var(--line); white-space: nowrap; }
.tag.book { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-soft); }
.extra-tag { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 40%, transparent); background: color-mix(in srgb, var(--violet) 10%, transparent); }
.pref { justify-self: start; display: inline-block; font: 600 .72rem/1.4 var(--f-mono); color: var(--accent); background: var(--acc-soft); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.badge { position: relative; display: inline-flex; font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--mute); white-space: nowrap; }
.badge.st-prog { background: var(--sig-soft); color: var(--signal); } .badge.st-done, .badge.st-ok { background: var(--ok-soft); color: var(--ok); }
.badge.st-weak { background: var(--warn-soft); color: var(--warn); } .badge.st-empty, .badge.st-draft { background: var(--surface-2); color: var(--mute); } .badge.st-pending, .badge.st-reading { background: var(--surface-2); color: var(--fg-2); }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--signal), var(--accent)); transition: width .6s var(--ease); }
[dir="rtl"] .meter span { background: linear-gradient(270deg, var(--signal), var(--accent)); }
.meter.thin { height: 3px; }
.empty-mini { padding: 28px; text-align: center; color: var(--mute); border: 1px dashed var(--line-2); border-radius: var(--r); display: flex; align-items: center; justify-content: center; gap: 8px; }
.empty { display: grid; justify-items: center; gap: 14px; text-align: center; padding: var(--s-7) var(--s-4); }
.empty p { color: var(--fg-2); max-width: 46ch; }
.empty-art, .empty .cover-art { width: min(260px, 70vw); height: auto; }
.cv-l { fill: none; stroke: var(--line-2); stroke-width: 1.4; } .cv-g { stroke: var(--line); stroke-width: 1; } .cv-a { fill: var(--accent); stroke: var(--accent); } .cv-s { fill: var(--signal); }

/* ---------- toasts ---------- */
#toasts { position: fixed; z-index: 50; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.ai-banner-wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ai-banner { margin-top: 16px; }
.ai-off p { max-width: 80ch; }
.toast { pointer-events: auto; max-width: 560px; background: var(--surface); color: var(--fg); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); font-size: .9rem; animation: rise .3s var(--ease); }
.toast.ok { border-color: var(--ok); } .toast.bad { border-color: var(--bad); } .toast.warn { border-color: var(--warn); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .5s; }

/* ---------- sign-in ---------- */
.login { position: relative; min-height: calc(100vh - 160px); display: grid; place-items: center; isolation: isolate; }
.login .hero-field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.login-card { width: min(420px, 100%); display: grid; gap: 16px; padding: 32px 28px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.login-card h1 { font-size: 1.6rem; }
.login-mark { width: 48px; height: 48px; }
.login-card input { font-size: 1rem; padding: 11px 14px; }
.login-err { font-size: .9rem; }
#status-ai.prov { cursor: pointer; }
.prov-pick { display: grid; gap: 6px; margin-bottom: 12px; }
.prov-pick .ctl-l { font-weight: 600; font-size: .9rem; }
.prov-pick .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.prov-pick .seg button { flex: 1; border: 0; padding: 8px 10px; border-radius: 9px; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.prov-pick .seg button.on { background: var(--signal); color: var(--bg); }
body.is-login .nav, body.is-login #status-store, body.is-login #status-ai, body.is-login #ai-banner { display: none !important; }
/* ---------- home ---------- */
.hero { position: relative; display: grid; gap: var(--s-6); padding-block: var(--s-6) var(--s-5); isolation: isolate; }
.hero-field { position: absolute; inset: -40px -16px 0; width: calc(100% + 32px); height: calc(100% + 40px); z-index: -1; opacity: .9; mask-image: linear-gradient(to bottom, #000 55%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); }
[dir="rtl"] .hero-field { transform: scaleX(-1); }
.hero-copy { display: grid; gap: var(--s-4); max-width: 760px; }
.hero h1 { font-size: clamp(2.1rem, 1.4rem + 3.4vw, 3.7rem); font-weight: 700; line-height: 1.12; letter-spacing: -.025em; }
.hero .lead { font-size: 1.08rem; color: var(--fg-2); max-width: 60ch; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); max-width: 920px; }
.choice { position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: var(--s-4); row-gap: 2px; align-items: center; padding: 26px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); color: var(--fg); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .25s, box-shadow .25s; overflow: hidden; }
.choice::after { content: ""; position: absolute; inset: 0; background: radial-gradient(420px 160px at var(--mx, 80%) 0%, var(--sig-soft), transparent 70%); opacity: 0; transition: opacity .3s; pointer-events: none; }

.choice.primary:hover { box-shadow: 0 24px 50px -26px var(--glow); }
.choice-icon { grid-row: span 2; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--signal); font-size: 1.5rem; }
.choice.primary .choice-icon { background: var(--accent); color: var(--accent-ink); }
.choice-t { font: 600 1.25rem/1.3 var(--f-display); }
.choice-s { color: var(--mute); font-size: .9rem; grid-column: 2; }
.choice-go { grid-row: 1 / span 2; grid-column: 3; color: var(--mute); transition: transform .25s var(--ease); }
.choice:hover .choice-go { transform: translateX(4px); color: var(--fg); }
[dir="rtl"] .choice:hover .choice-go { transform: translateX(-4px); }
.store-note { display: flex; gap: 8px; align-items: flex-start; max-width: 760px; font-size: .84rem; color: var(--mute); }
.home-recent, .how, .subjects { margin-top: var(--s-7); display: grid; gap: var(--s-4); }
.cards-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s-4); }
.how-steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); counter-reset: s; }
.how-steps li { display: flex; gap: 14px; padding: 18px; border-top: 1px solid var(--line-2); }
.how-n { font: 600 1.6rem/1 var(--f-mono); color: var(--accent); }
.how-steps h3 { margin-bottom: 4px; } .how-steps p { color: var(--fg-2); font-size: .92rem; }
.subj-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); }
.subj { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.subj .cover-art { display: block; width: 100%; height: 110px; background: var(--bg-2); }
.subj > div { padding: 14px 16px 18px; } .subj p { color: var(--fg-2); font-size: .9rem; }
.subjects > .btn { justify-self: start; }
@media (max-width: 900px) { .subj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .how-steps { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .choices { grid-template-columns: 1fr; } .choice { padding: 20px; } .choice-icon { width: 46px; height: 46px; } }

/* ---------- library ---------- */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: var(--s-3); margin-bottom: var(--s-5); }
.search { position: relative; display: block; } .search .ic { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--mute); }
.search input { padding-inline-start: 38px; }
@media (max-width: 760px) { .filters { grid-template-columns: 1fr 1fr; } .search { grid-column: 1 / -1; } }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: var(--s-5); }
.lcard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .25s, opacity .3s; min-width: 0; }
.lcard:hover { transform: translateY(-3px); border-color: var(--line-2); }
.lcard.leaving { opacity: 0; transform: scale(.96); }
.lcard-cover { position: relative; display: block; aspect-ratio: 16 / 7.5; max-width: 100%; overflow: hidden; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--bg-2); }
.lcard-cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; filter: saturate(.85); }
.lcard-cover .cover-art { width: 100%; height: 100%; display: block; }
.lcard-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, color-mix(in srgb, var(--surface) 75%, transparent), transparent 55%); }
.lcard-cover .badge { position: absolute; z-index: 1; top: 12px; inset-inline-start: 12px; backdrop-filter: blur(6px); }
.lcard-cover .badge.st-ready { inset-inline-start: auto; inset-inline-end: 12px; background: rgba(242,181,68,.9); color: #1a1205; }
.lcard-body { display: grid; gap: 10px; padding: 16px 18px 18px; flex: 1; align-content: start; }
.lcard-meta { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--mute); }
.subj-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.subj-dot.s-physics { background: var(--signal); } .subj-dot.s-math { background: var(--violet); } .subj-dot.s-chemistry { background: var(--ok); } .subj-dot.s-history, .subj-dot.s-geography { background: var(--accent); } .subj-dot.s-biology { background: #34D399; }
.lcard-title { font-size: 1.12rem; overflow-wrap: anywhere; }
.lcard-prog { font-size: .82rem; color: var(--mute); } .lcard-prog b { color: var(--fg); font-family: var(--f-mono); }
.lcard-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; font-size: .8rem; }
.lcard-dates dt { color: var(--mute); } .lcard-dates dd { margin: 0; color: var(--fg-2); }
.lcard-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.menu { position: relative; }
.menu-pop { position: absolute; z-index: 5; inset-inline-end: 0; bottom: calc(100% + 6px); min-width: 230px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); display: grid; }
.menu-pop button { text-align: start; background: none; border: 0; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: .9rem; }
.menu-pop button:hover:not(:disabled) { background: var(--surface-2); }
.menu-pop button:disabled { opacity: .4; cursor: default; }
.menu-pop .danger { color: var(--bad); }
.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.confirm.danger { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.skeleton-row { display: contents; } .sk { height: 320px; border-radius: var(--r-lg); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: sk 1.4s infinite; }
@keyframes sk { to { background-position: -150% 0; } }
.cover-art.s-math .cv-a { fill: none; }

/* ---------- intake ---------- */
.steps { list-style: none; padding: 0; margin: 0 0 var(--s-5); display: flex; gap: 6px; flex-wrap: wrap; counter-reset: st; }
.steps li { counter-increment: st; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 99px; color: var(--mute); font-size: .86rem; border: 1px solid var(--line); }
[dir="rtl"] .steps li { padding: 6px 6px 6px 14px; }
.steps li::before { content: counter(st); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 .74rem var(--f-mono); }
.steps li.on { color: var(--fg); border-color: var(--accent); } .steps li.on::before { background: var(--accent); color: var(--accent-ink); }
.steps li.done { color: var(--fg-2); } .steps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.intake { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s-5); align-items: start; }
.intake-main { display: grid; gap: var(--s-4); min-width: 0; }
.intake-side { min-width: 0; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: grid; gap: var(--s-4); }
@media (max-width: 960px) { .intake { grid-template-columns: 1fr; } .intake-side { position: static; order: -1; } }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); padding: var(--s-6) var(--s-4); text-align: center; display: grid; gap: 10px; justify-items: center; background: linear-gradient(180deg, var(--surface), transparent); transition: border-color .2s, background .2s; }
.drop.over { border-color: var(--signal); background: var(--sig-soft); }
.drop-art { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--sig-soft); color: var(--signal); font-size: 1.8rem; }
.drop-t { font: 600 1.12rem var(--f-display); } .drop-s { color: var(--mute); font-size: .88rem; }
.paste { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; background: var(--surface); }
.paste summary, .title-only summary, details summary { cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; margin-inline-start: auto; color: var(--mute); font-family: var(--f-mono); }
details[open] > summary::after { content: "−"; }
.paste[open] { display: grid; gap: 10px; }
.paste[open] textarea { margin-top: 10px; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s-3); }
.ptile { position: relative; display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; transition: border-color .2s, transform .2s; }
.ptile.dragging { opacity: .4; } .ptile.st-weak { border-color: color-mix(in srgb, var(--warn) 60%, var(--line)); } .ptile.st-ok { border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); }
.ptile.editing { grid-column: 1 / -1; grid-template-columns: 190px 1fr; grid-template-rows: auto auto; }
.ptile.editing .ptile-editor { grid-column: 1 / -1; }
.ptile-img { position: relative; aspect-ratio: 3 / 3.4; max-width: 100%; background: #fff; overflow: hidden; }
.ptile-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.ptile-text { padding: 10px; font-size: .7rem; line-height: 1.5; color: #333; background: #fbfbf8; height: 100%; overflow: hidden; }
.ptile-n { position: absolute; top: 8px; inset-inline-start: 8px; font: 600 .75rem var(--f-mono); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 2px 7px; }
.ptile-body { padding: 10px; display: grid; gap: 6px; align-content: start; }
.ptile-label { font-size: .8rem; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile-issue { font-size: .76rem; color: var(--warn); }
.ptile-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.ptile-actions .icon-btn { width: 28px; height: 28px; }
.ptile-editor { padding: 10px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.range { gap: 10px; }
.go-area { display: grid; gap: 10px; }
.reading, .analyzing { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 8px 0; }
.analyzing .big { font: 600 1.05rem var(--f-display); }
.an-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; text-align: start; width: 100%; }
.an-steps li { display: flex; gap: 10px; align-items: center; color: var(--mute); font-size: .88rem; }
.an-steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-2); flex: none; }
.an-steps li.on { color: var(--fg); } .an-steps li.on::before { border-color: var(--accent); background: var(--accent); animation: pulse 1s infinite alternate; }
.an-steps li.done { color: var(--fg-2); } .an-steps li.done::before { background: var(--ok); border-color: var(--ok); }
@keyframes pulse { to { box-shadow: 0 0 0 5px var(--glow); } }

/* loaders */
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.orbit-loader { position: relative; width: 56px; height: 56px; margin: 0 auto; }
.orbit-loader span { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--signal); animation: spin 1.1s linear infinite; }
.orbit-loader span:nth-child(2) { inset: 9px; border-top-color: var(--accent); animation-duration: .8s; animation-direction: reverse; }
.orbit-loader span:nth-child(3) { inset: 22px; background: var(--accent); border: 0; animation: pulse .8s infinite alternate; }
.gen-wait { display: grid; gap: 12px; justify-items: center; padding: var(--s-6) 0; color: var(--fg-2); }
.ws-loading { padding: var(--s-8) 0; }

/* ---------- workspace ---------- */
.ws { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: var(--s-6); align-items: start; }
.ws-nav { position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); display: grid; gap: var(--s-4); max-height: calc(100vh - 90px); overflow: auto; padding-bottom: 12px; scrollbar-width: thin; }
.ws-id { display: grid; gap: 8px; padding-bottom: var(--s-4); border-bottom: 1px solid var(--line); }
.ws-title { font-size: 1.22rem; overflow-wrap: anywhere; }
.ws-prog { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--mute); }
.ws-prog b { color: var(--fg); font-family: var(--f-mono); }
.ring { width: 38px; height: 38px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; } .ring-bg { stroke: var(--surface-2); } .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .6s var(--ease); }
.ws-tabs { display: grid; gap: 2px; }
.ws-grp { font: 600 .7rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); padding: 14px 10px 6px; }
.ws-tab { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 10px; color: var(--fg-2); cursor: pointer; text-align: start; font-size: .93rem; transition: background .15s, color .15s; }
.ws-tab:hover { background: var(--surface); color: var(--fg); }
.ws-tab.on { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.ws-tab.on .ic { color: var(--accent); }
.ws-main { min-width: 0; }
.ws-body { display: grid; gap: var(--s-5); animation: rise .35s var(--ease); }
@media (max-width: 960px) {
  .ws { grid-template-columns: 1fr; gap: var(--s-4); }
  .ws-nav { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 10; max-height: none; overflow: visible; background: var(--bg); padding: 8px 0 0; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
  .ws-id { grid-template-columns: 1fr auto; align-items: center; padding-bottom: 6px; border: 0; }
  .ws-id .lcard-meta { grid-column: 1 / -1; } .ws-title { font-size: 1.05rem; }
  .ws-tabs { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 8px; scrollbar-width: none; }
  .ws-tabs::-webkit-scrollbar { display: none; }
  .ws-grp { display: none; }
  .ws-tab { flex: none; padding: 7px 12px; font-size: .86rem; background: var(--surface); border: 1px solid var(--line); }
  .ws-tab.on { border-color: var(--accent); box-shadow: none; }
}
.tool-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s-4); flex-wrap: wrap; }
.tool-head > div { display: grid; gap: 6px; min-width: 0; }
.sub { margin-top: var(--s-2); color: var(--fg-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* prose + math */
.prose { display: grid; gap: .6em; overflow-wrap: anywhere; }
.prose ul, .prose ol { margin: 0; padding-inline-start: 1.3em; display: grid; gap: .3em; }
.prose strong { color: var(--fg); font-weight: 600; }
.prose code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.mdh { margin-top: .4em; }
math { font-size: 1.08em; } .math { white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
.mathblock { direction: ltr; overflow-x: auto; overflow-y: hidden; padding: 6px 2px; text-align: center; }
.mathblock math { font-size: 1.22em; }
.extra { display: grid; gap: 6px; border-inline-start: 3px solid var(--violet); background: color-mix(in srgb, var(--violet) 8%, transparent); padding: 10px 14px; border-radius: 0 10px 10px 0; }
[dir="rtl"] .extra { border-radius: 10px 0 0 10px; }
.extra .extra-tag { justify-self: start; }
.big-num { font: 600 1.4rem var(--f-mono); direction: ltr; }

/* overview */
.ov-hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s-5); align-items: center; padding: var(--s-5); border-radius: var(--r-lg); border: 1px solid var(--line); background: linear-gradient(135deg, var(--surface), var(--bg-2)); }
.ov-copy { display: grid; gap: 12px; min-width: 0; }
.ov-title { font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2rem); }
.ov-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--mute); font-size: .85rem; }
.ov-meta span { display: inline-flex; align-items: center; gap: 6px; }
.ov-art .cover-art { width: 100%; height: auto; max-height: 200px; }
@media (max-width: 720px) { .ov-hero { grid-template-columns: 1fr; } .ov-art { display: none; } }
.lmap { list-style: none; padding: 0; margin: var(--s-3) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; counter-reset: lm; }
.lmap button { width: 100%; height: 100%; display: grid; gap: 6px; text-align: start; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, transform .2s; }
.lmap button:hover { border-color: var(--signal); transform: translateY(-2px); }
.lmap li.done button { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.lmap-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 .78rem var(--f-mono); color: var(--fg-2); }
li.done .lmap-n, .sec-list .done .lmap-n { background: var(--ok-soft); color: var(--ok); }
.lmap-t { font-weight: 600; } .lmap-s { font-size: .8rem; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ov-cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--s-5); }
.ov-cols > section:first-child { display: grid; gap: 12px; align-content: start; }
@media (max-width: 860px) { .ov-cols { grid-template-columns: 1fr; } }
.obj { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 6px; color: var(--fg-2); }
.pbars { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.pbars li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px 40px; gap: 10px; align-items: center; font-size: .84rem; color: var(--fg-2); }
.pbars b { font-family: var(--f-mono); text-align: end; color: var(--fg); } .pbars small { color: var(--mute); font-family: var(--f-mono); }
.ov-total { font-size: 1rem; } .ov-total b { font-family: var(--f-mono); color: var(--accent); }
.laws { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: var(--s-3); }
.law { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); align-content: start; }
.law-eq { padding: 10px; border-radius: 10px; background: var(--bg-2); }
.law-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.law-meta p { flex-basis: 100%; }
table.sym { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.sym td { padding: 5px 6px; border-top: 1px solid var(--line); }
table.sym td:first-child { width: 48px; direction: ltr; text-align: center; }
table.sym td:last-child { color: var(--mute); font-family: var(--f-mono); text-align: end; white-space: nowrap; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: var(--s-3); }
.tool-tile { display: grid; gap: 6px; justify-items: start; text-align: start; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, transform .2s; }
.tool-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tool-tile .ic { color: var(--accent); width: 1.4em; height: 1.4em; } .tool-tile span { font-weight: 600; } .tool-tile small { font-size: .74rem; color: var(--mute); }

/* explain */
.ex-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--s-5); align-items: start; }
.sec-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); }
.sec-list button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: start; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--fg-2); font-size: .9rem; }
.sec-list button:hover { background: var(--surface); }

.vak-path button:hover { border-color: var(--signal); }

.btn.speaking { border-color: var(--accent); color: var(--accent); }
/* video */
.vid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: var(--s-5); align-items: start; margin-bottom: var(--s-5); }
.vid-frame { border-radius: var(--r-lg); overflow: hidden; background: #000; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; }
.vid-frame video, .vid-frame iframe { width: 100%; height: 100%; display: block; border: 0; }
.vid-frame video::cue { font-family: var(--f-body); font-size: 1.05rem; background: rgba(9,14,26,.82); }

.vid-ch button:hover { background: var(--surface); } .vid-ch button.on { border-color: var(--line-2); background: var(--surface); color: var(--fg); }
.vid-add { margin-bottom: var(--s-4); }
.after-watch .btn .ic { width: 18px; height: 18px; }

.ls-layout { display: grid; grid-template-columns: minmax(200px, 280px) minmax(0, 1fr); gap: var(--s-5); align-items: start; }

.ls-list button.on { border-color: var(--accent); }
.ls-read { min-width: 0; } .ls-ctl { position: sticky; top: 70px; z-index: 2; }
#ls-text p { padding: 8px 12px; border-radius: 10px; transition: background .25s; line-height: 1.9; margin: 0; }
#ls-text p:first-child { font-weight: 700; font-size: 1.1rem; }
#ls-text p.reading { background: var(--acc-soft); box-shadow: inset 3px 0 0 var(--accent); }
[dir="rtl"] #ls-text p.reading { box-shadow: inset -3px 0 0 var(--accent); }
/* drag and sort */
.so { display: grid; gap: var(--s-4); }
.so-pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 64px; padding: 12px; border-radius: var(--r); border: 1px dashed var(--line-2); background: var(--bg-2); }
.so-zones { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.so-zone { display: grid; grid-template-rows: auto 1fr; gap: 8px; padding: 12px; min-height: 130px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, background .15s; cursor: pointer; }
.so-zone h4 { font-size: .95rem; color: var(--fg); }
.so-drop { display: flex; flex-wrap: wrap; gap: 6px; align-content: start; }
.so-zone.over, .so-pool.over { border-color: var(--signal); background: var(--sig-soft); }
.so-chip { touch-action: none; user-select: none; -webkit-user-select: none; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg); cursor: grab; font-size: .92rem; line-height: 1.5; text-align: start; }
.so-chip.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--acc-soft); }
.so-chip.lifting { opacity: .35; }
.so-ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; cursor: grabbing; box-shadow: var(--shadow); border-color: var(--signal); }
.so-chip.right { border-color: var(--ok); background: var(--ok-soft); } .so-chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.so-msg { font-weight: 600; } .ok-text { color: var(--ok); }
/* credits footer */
.credits { margin-top: var(--s-7); padding: var(--s-5) max(16px, env(safe-area-inset-right, 0px)) calc(var(--s-5) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); text-align: center; display: grid; gap: 6px; }
.cr-k { font-size: .82rem; font-weight: 600; color: var(--mute); }
.cr-n { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-family: var(--f-display); font-weight: 600; color: var(--fg); }
.cr-n i { font-style: normal; color: var(--accent); }
body.is-login .credits { position: relative; z-index: 2; }
@media (max-width: 900px) {
  .vak-cards { grid-template-columns: 1fr; }
  .vid, .ls-layout { grid-template-columns: 1fr; }
  .so-zones { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) { .so-zones { grid-template-columns: 1fr; } }
.login-or { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: .85rem; }
.login-or::before, .login-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

<div class="backdrop" aria-hidden="true"></div>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#" data-go-home aria-label="Misbar">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--line-2)" stroke-width="1.5"/><ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="var(--signal)" stroke-width="1.6" transform="rotate(-28 16 16)"/><circle cx="16" cy="16" r="4.2" fill="var(--accent)"/><circle cx="27.4" cy="10" r="2.1" fill="var(--signal)"/></svg>
      <span id="brand-name">مِسبار</span>
    </a>
    <nav class="nav"><a href="#" data-r="home" id="nav-home">الرئيسية</a><a href="#library" data-r="library" id="nav-lib">المكتبة</a></nav>
    <div class="top-tools">
      <span class="pill" id="status-store" tabindex="0"><span></span></span>
      <span class="pill" id="status-ai" tabindex="0"><span></span></span>
      <button class="tbtn" id="theme-btn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span id="theme-label"></span></button>
      <button class="tbtn" id="lang-btn" type="button">English</button>
      <button class="tbtn" id="who" type="button" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span></span></button>
    </div>
  </div>
</header>
<div class="ai-banner-wrap"><div id="ai-banner" hidden></div></div>

<footer class="credits"><p class="cr-k" id="cr-k">تنفيذ وإعداد · دراسة بحث إجرائي</p><p class="cr-n"><span>أ. مشعل الزهراني</span><i>|</i><span>رائد العتيبي</span><i>|</i><span>فيصل الشهراني</span></p></footer>

<script>
(function () {
  const { $ } = NL;
  NL.setLang(NL.lang); NL.applyTheme();
  const route = () => {
    const h = location.hash.slice(1);
    if (h.startsWith('l-')) return NL.go('lesson', { id: h.slice(2) });
    if (['library', 'new', 'bench'].includes(h)) return NL.go(h);
    NL.go('home');
  };
  $('#lang-btn').onclick = () => {
    NL.setLang(NL.lang === 'ar' ? 'en' : 'ar');
    const a = NL.app; NL.go(a.route, a.route === 'lesson' ? { id: a.params.id, tab: NL.ws.tab } : a.params || {});
  };
  $('#theme-btn').onclick = () => {
    const order = ['system', 'dark', 'light']; NL.themePref = order[(order.indexOf(NL.themePref) + 1) % 3];
    NL.lsSet('theme', NL.themePref); NL.applyTheme(); NL.renderShell();
  };
  document.querySelector('[data-go-home]').onclick = (e) => { e.preventDefault(); NL.go('home'); };
  document.querySelectorAll('.nav a').forEach((a) => (a.onclick = (e) => { e.preventDefault(); NL.go(a.dataset.r); }));
  document.addEventListener('pointermove', (e) => { const c = e.target.closest?.('.choice'); if (c) { const b = c.getBoundingClientRect(); c.style.setProperty('--mx', ((e.clientX - b.left) / b.width * 100) + '%'); } });
  NL.on('storage', NL.renderShell);
  let linkWas = false, aiWasReady = false;
  NL.on('ai', () => { NL.renderShell(); if (NL.ai.checked && (NL.ai.ready !== aiWasReady || NL.ai.claudeLink !== linkWas)) { aiWasReady = NL.ai.ready; linkWas = NL.ai.claudeLink; const a = NL.app; if (a.route === 'new' || a.route === 'lesson') NL.go(a.route, a.route === 'lesson' ? { id: a.params.id, tab: NL.ws.tab } : a.params || {}); } });
  document.addEventListener('click', async (e) => {
    if (e.target.closest('[data-ai-retry]')) { e.preventDefault(); await NL.ai.init(); }
  });
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('[data-code-form]'); if (!f) return;
    e.preventDefault(); const code = f.querySelector('input').value.trim(); if (!code) return;
    NL.lsSet('code', code); await NL.ai.init();
    if (NL.ai.needCode) NL.toast(NL.t('codeBad'), 'bad');
  });
  document.querySelector('#who').onclick = () => NL.auth.signOut();
  (async () => {
    await NL.auth.init();
    // the teacher can share …/#guest so students skip the sign-in page
    if (NL.auth.required && !NL.auth.user && location.hash === '#guest' && NL.auth.guests) { try { await NL.auth.signInGuest(); history.replaceState(null, '', location.pathname); } catch {} }
    if (NL.auth.required && !NL.auth.user) { NL.go('login'); return; }
    const ready = NL.store.init();
    NL.ai.init();
    const h = location.hash.slice(1);
    if (!h.startsWith('l-') && h !== 'new') route(); else NL.renderShell();
    ready.then(async () => { await NL.loadLessons(); if (h.startsWith('l-') || h === 'new') route(); });
  })();
})();
</script>
